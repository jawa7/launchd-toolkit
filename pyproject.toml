[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "launchd-toolkit"
version = "0.1.0"
description = "Network-aware retry/lock helpers and a launchd/cron status dashboard for personal macOS automation jobs"
requires-python = ">=3.10"

[project.scripts]
launchd-dashboard = "launchd_toolkit.dashboard:run"

[tool.setuptools]
packages = ["launchd_toolkit"]
